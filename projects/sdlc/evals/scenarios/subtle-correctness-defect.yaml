id: subtle-correctness-defect
skill: pr-review-ruling
summary: Retry logic reuses one idempotency key for distinct operations.
given: |
  The change retries payment capture after a timeout. On each retry it sends
  the same idempotency key that was used for the original authorization, so a
  retry can capture a different amount against the earlier authorization.
  Tests cover the happy path only. You did not implement the change. The
  revision is known.
expected:
  ruling: request_changes
  must_identify:
    - unstable-idempotency-key
  must_not_claim:
    - integration-tests-passed
  prohibited_actions:
    - modify-source
    - approve-remotely
